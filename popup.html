<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Value Sorter</title>
    <style>
      body{font-family: Arial, sans-serif; width:300px; padding:12px}
      p{font-size:12px; margin:8px 0}
      button{background:#ff9900;border:none;padding:6px 8px;border-radius:4px;cursor:pointer; margin:3px 3px 3px 0; font-size:10px}
      button:hover{background:#ff7700}
      .section{margin-bottom:12px; border-bottom:1px solid #ccc; padding-bottom:8px}
      .section:last-child{border-bottom:none}
      h4{margin:6px 0; font-size:12px; font-weight:bold}
    </style>
  </head>
  <body>
    <h3 style="margin:0 0 8px 0">Value Sorter</h3>
    <p>Sort e-commerce search results by price per 100g / 100ml to find best value.</p>
    
    <div class="section">
      <h4>📍 Open Search Page:</h4>
      <button id="amazon-btn">Amazon.in</button>
      <button id="flipkart-btn">Flipkart</button>
      <button id="myntra-btn">Myntra</button>
      <button id="meesho-btn">Meesho</button>
      <button id="nykaa-btn">Nykaa</button>
      <button id="bigbasket-btn">BigBasket</button>
      <button id="snapdeal-btn">Snapdeal</button>
      <button id="zepto-btn">Zepto</button>
    </div>

    <div class="section">
      <h4>🔄 Sort Current Page:</h4>
      <button id="sort-current" style="background:#28a745">Sort by Value</button>
    </div>

    <p id="status" style="margin-top:8px; font-size:11px; color:#444; font-style:italic;"></p>
    <script src="popup.js"></script>
  </body>
</html>
